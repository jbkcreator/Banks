[project]
name = "banks"
version = "0.1.0"
description = "Banks — Josh's personal operations AI employee. Separate infrastructure, separate invoice, hard wall from Forced Action."
requires-python = ">=3.11"
dependencies = [
    "slack_sdk>=3.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["banks", "banks.store"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
