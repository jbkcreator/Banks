[project]
name = "banks"
version = "0.1.0"
description = "Banks — Josh's personal operations AI employee. Separate infrastructure, separate invoice, hard wall from Forced Action."
requires-python = ">=3.11"
dependencies = [
    "slack_sdk>=3.27",
    # HTTP client used across ports (Clay webhook, JD fetch, Resend mailer).
    # Imported at module load in contact_enrichment/enrich/mailer, so the
    # scheduled enrichment jobs need it present even on the unprovisioned no-op.
    "httpx>=0.27",
    # Google service-account clients — read-only Calendar + the enrichment Sheet
    # buffer. Imported lazily (only on the live path), declared so live works.
    "google-auth>=2.0",
    "google-api-python-client>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["banks", "banks.store"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
